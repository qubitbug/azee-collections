name: Keep Supabase Awake Ping

on:
  schedule:
    # Runs automatically every day at 12:00 UTC (around noon/afternoon)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase Database to prevent sleep mode..."
          curl -s -X GET "https://pxwqnvqkzzupfwjhdnqw.supabase.co/rest/v1/products?select=id&limit=1" \
          -H "apikey: sb_publishable_5kWH1nU5rwPav8crAAp08g_t_jjaKRP" \
          -H "Authorization: Bearer sb_publishable_5kWH1nU5rwPav8crAAp08g_t_jjaKRP"
          echo -e "\nPing successful! Database is awake."
